syntax = "proto3";

package taskboard.v1;

import "google/protobuf/empty.proto";
import "google/api/annotations.proto";

option csharp_namespace = "TaskBoard.Contracts.V1";

message Label{
	 int32 id = 1;
	 string name = 2;
	 string color = 3; // #FF8800
}

// The service definition.
service LabelService  {
    // Create
    rpc CreateLabel(CreateLabelRequest) returns (Label) {
        option (google.api.http) = { post: "/v1/labels" body: "*" };
    }

    // Read single
    rpc GetLabel(GetLabelRequest) returns (Label) {
        option (google.api.http) = { get: "/v1/labels/{id}" };
    }

    // Read list
    rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse) {
        option (google.api.http) = { get: "/v1/labels" };
    }

    // Update (PUT: replaces name AND color, the request has no optional fields)
    rpc UpdateLabel(UpdateLabelRequest) returns (Label) {
        option (google.api.http) = { put: "/v1/labels/{id}" body: "*" };
    }

    // Delete
    rpc DeleteLabel(DeleteLabelRequest) returns (google.protobuf.Empty) {
        option (google.api.http) = { delete: "/v1/labels/{id}" };
    }
}

// The request message
message CreateLabelRequest {
  string name = 1;
  string color = 2;
}

message GetLabelRequest {
  int32 id = 1;
}

message ListLabelsRequest {}

message UpdateLabelRequest {
  int32 id = 1;
  string name = 2;
  string color = 3;
}

message DeleteLabelRequest {
  int32 id = 1;
}

// The response message.
message ListLabelsResponse  {
  repeated Label labels = 1;
}
