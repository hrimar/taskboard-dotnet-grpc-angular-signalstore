syntax = "proto3";

package taskboard.v1;

import "google/protobuf/empty.proto"; 
import "google/protobuf/timestamp.proto";
import "taskitem.proto";
import "google/api/annotations.proto";

option csharp_namespace = "TaskBoard.Contracts.V1";

message Board {
  int32 id = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Timestamp created_at = 4;
}

// The service definition
service BoardService  {
    // The google.api.http options map each RPC to a REST route (JSON transcoding): {id} in the path
    // fills the field of the same name in the request message, `body: "*"` reads the remaining
    // fields from the JSON body. They only ADD a way in; the gRPC contract itself is unchanged.

    // Create
    rpc CreateBoard(CreateBoardRequest) returns (Board) {
        option (google.api.http) = { post: "/v1/boards" body: "*" };
    }

    // Read single
    rpc GetBoard(GetBoardRequest) returns (Board) {
        option (google.api.http) = { get: "/v1/boards/{id}" };
    }

    // Read list
    rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse) {
        option (google.api.http) = { get: "/v1/boards" };
    }

    // Update (PATCH: only the fields present in the JSON body change)
    rpc UpdateBoard(UpdateBoardRequest) returns (Board) {
        option (google.api.http) = { patch: "/v1/boards/{id}" body: "*" };
    }

    // Delete
    rpc DeleteBoard(DeleteBoardRequest) returns (google.protobuf.Empty) {
        option (google.api.http) = { delete: "/v1/boards/{id}" };
    }

    // Server streaming: stays open and pushes an event whenever a task on the board is
    // created, updated or deleted. It sends changes only - no initial snapshot - so a client
    // loads the current tasks with ListTaskItems and (re)syncs that way after every reconnect.
    // Deliberately has no REST route: a long-lived stream is not request/response JSON.
    rpc WatchBoard(WatchBoardRequest) returns (stream BoardEvent);
}

// The request messages
message CreateBoardRequest {
	string name = 1;
	optional string description = 2;
}

message GetBoardRequest {
	int32 id = 1;
}

message ListBoardsRequest {}

message UpdateBoardRequest {
	int32 id = 1;
	optional string name = 2;
	optional string description = 3;
}

message DeleteBoardRequest {
	int32 id = 1;
}

message WatchBoardRequest {
	int32 board_id = 1;
}

// One change on a watched board. Exactly one field is set (oneof).
message BoardEvent {
	oneof event {
		TaskItem task_created = 1;
		TaskItem task_updated = 2;
		int32 task_deleted_id = 3;
	}
}

// The response message
message ListBoardsResponse  {
  repeated Board boards = 1;
}


