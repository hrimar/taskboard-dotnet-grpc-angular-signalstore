# Continuous integration only (no deployment): proves every PR builds and passes its tests
# on a clean machine, independent of anything installed or generated locally.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# A newer push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore TaskBoard.sln
      - run: dotnet build TaskBoard.sln --no-restore --configuration Release
      - run: dotnet test TaskBoard.sln --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/taskboard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/taskboard-web/package-lock.json
      - run: npm ci
      # prebuild runs proto:gen, so this also verifies the TS clients generate from the .proto files.
      - run: npm run build
      - run: npx ng test --watch=false --browsers=ChromeHeadless

  # The whole path browser -> gRPC-Web -> API -> SQLite, including the WatchBoard stream.
  # playwright.config.ts starts the API and ng serve itself (webServer), on their own ports
  # and a fresh database, so this job needs no service containers.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/taskboard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/taskboard-web/package-lock.json
      - run: npm ci
      # --with-deps adds the system libraries Chromium needs on a bare Ubuntu runner.
      - run: npx playwright install --with-deps chromium
      # Built up front (Release, like e2e/start-api.mjs runs it) so the webServer timeout only
      # covers startup, and a compile error shows up as its own failed step.
      - run: dotnet build ../../src/TaskBoard.Api --configuration Release
      - run: npx playwright test
      # Also (especially) on failure: the report holds the trace of the retried test.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: client/taskboard-web/playwright-report/
          retention-days: 14
