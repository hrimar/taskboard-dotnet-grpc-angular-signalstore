<div class="header">
  <h3 class="title">{{ task().title }}</h3>
  <span class="priority" [class]="priorityClass()">{{ priorityText() }}</span>
</div>

@if (task().description) {
  <p class="description">{{ task().description }}</p>
}

@if (dueDate(); as due) {
  <p class="due" [class.overdue]="overdue()">
    <mat-icon inline>event</mat-icon>
    {{ due | date: 'mediumDate' }}
    @if (overdue()) {
      <span>(overdue)</span>
    }
  </p>
}

@if (labels().length > 0) {
  <ul class="labels">
    @for (label of labels(); track label.id) {
      <li [style.background-color]="label.color" [style.color]="label.textColor">{{ label.name }}</li>
    }
  </ul>
}

<div class="actions">
  <button mat-button type="button" (click)="edit.emit(task())">Edit</button>
  <button mat-button type="button" (click)="remove.emit(task())">Delete</button>
</div>
